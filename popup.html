<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faker BR</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>Faker BR</h1>
          <p data-i18n="tagline">Dados brasileiros para testes rápidos.</p>
        </div>
        <div class="header-controls">
          <label class="compact-field">
            <span data-i18n="languageLabel">Idioma</span>
            <select id="language">
              <option value="pt-BR">Português</option>
              <option value="en">English</option>
              <option value="es">Español</option>
            </select>
          </label>
          <span class="badge">MV3</span>
        </div>
      </header>

      <section class="panel compact-panel">
        <label>
          <span data-i18n="dataLocaleLabel">Dados</span>
          <select id="dataLocale">
            <option value="BR" data-i18n="brazilData">Brasil</option>
            <option value="US" data-i18n="usData">Estados Unidos</option>
          </select>
        </label>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2 data-i18n="personTitle">Pessoa</h2>
          <button id="generatePerson" class="icon-button" type="button" title="Gerar pessoa" data-i18n-title="generatePersonTitle">↻</button>
        </div>

        <div class="grid">
          <label>
            <span data-i18n="firstNameLabel">Nome</span>
            <input id="firstName" type="text" autocomplete="off">
          </label>
          <label>
            <span data-i18n="lastNameLabel">Sobrenome</span>
            <input id="lastName" type="text" autocomplete="off">
          </label>
        </div>

        <label>
          <span data-i18n="fullNameLabel">Nome completo</span>
          <input id="fullName" type="text" autocomplete="off">
        </label>

        <label>
          <span data-i18n="cpfLabel">CPF</span>
          <input id="cpf" type="text" autocomplete="off">
        </label>

        <div class="actions">
          <button id="copyPerson" class="secondary" type="button" data-i18n="copyButton">Copiar</button>
          <button id="fillPerson" type="button" data-i18n="fillPageButton">Preencher página</button>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2 data-i18n="tempEmailTitle">Email temporário</h2>
          <button id="refreshInbox" class="icon-button" type="button" title="Atualizar inbox" data-i18n-title="refreshInboxTitle">↻</button>
        </div>

        <label>
          <span data-i18n="emailLabel">Email</span>
          <input id="tempEmail" type="email" autocomplete="off" readonly placeholder="Gere uma caixa Mail.tm" data-i18n-placeholder="tempEmailPlaceholder">
        </label>

        <div class="actions">
          <button id="copyTempEmail" class="secondary" type="button" data-i18n="copyButton">Copiar</button>
          <button id="fillTempEmail" type="button" data-i18n="fillPageButton">Preencher página</button>
        </div>

        <button id="generateTempEmail" type="button" data-i18n="generateTempEmailButton">Gerar email temporário</button>

        <div class="inbox">
          <div class="inbox-header">
            <span>Inbox</span>
            <a href="https://mail.tm" target="_blank" rel="noreferrer">Mail.tm</a>
          </div>
          <div id="inboxList" class="inbox-list" data-i18n="noTempEmailActive">Nenhum email temporário ativo.</div>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2 data-i18n="companyTitle">Empresa fake</h2>
          <button id="generateCompany" class="icon-button" type="button" title="Gerar empresa" data-i18n-title="generateCompanyTitle">↻</button>
        </div>

        <label>
          <span data-i18n="companyNameLabel">Nome da empresa</span>
          <input id="companyName" type="text" autocomplete="off">
        </label>

        <label>
          <span data-i18n="cnpjLabel">CNPJ</span>
          <input id="cnpj" type="text" autocomplete="off">
        </label>

        <div class="actions">
          <button id="copyCompany" class="secondary" type="button" data-i18n="copyButton">Copiar</button>
          <button id="fillCompany" type="button" data-i18n="fillPageButton">Preencher página</button>
        </div>
      </section>

      <section class="panel">
        <h2>BrasilAPI CNPJ</h2>
        <label>
          <span data-i18n="cnpjLookupLabel">CNPJ para consulta</span>
          <input id="lookupCnpj" type="text" inputmode="numeric" placeholder="CNPJ aleatório" data-i18n-placeholder="randomCnpjPlaceholder" autocomplete="off">
        </label>
        <div class="actions">
          <button id="useExampleCnpj" class="secondary" type="button" data-i18n="useExampleButton">Usar randômico</button>
          <button id="fetchCnpj" type="button" data-i18n="fetchAndFillButton">Buscar e preencher</button>
        </div>
        <output id="cnpjResult" class="result"></output>
      </section>

      <section class="panel">
        <h2>ViaCEP</h2>
        <label>
          <span data-i18n="cepLabel">CEP válido</span>
          <input id="cep" type="text" inputmode="numeric" placeholder="01001000" autocomplete="off">
        </label>
        <div class="actions">
          <button id="generateCep" class="secondary" type="button" data-i18n="generateCepButton">Gerar CEP</button>
          <button id="fetchCep" type="button" data-i18n="fetchAndFillButton">Buscar e preencher</button>
        </div>
        <output id="cepResult" class="result"></output>
      </section>

      <section class="panel">
        <h2 data-i18n="usToolsTitle">Estados Unidos</h2>
        <div class="section-title">
          <h2 data-i18n="usAddressTitle">Endereço americano</h2>
          <button id="generateUsAddress" class="icon-button" type="button" title="Gerar endereço americano" data-i18n-title="generateUsAddressTitle">↻</button>
        </div>
        <div class="grid">
          <label>
            <span data-i18n="streetLabel">Rua</span>
            <input id="usStreet" type="text" autocomplete="off">
          </label>
          <label>
            <span data-i18n="numberLabel">Número</span>
            <input id="usNumber" type="text" inputmode="numeric" autocomplete="off">
          </label>
        </div>
        <div class="grid">
          <label>
            <span data-i18n="cityLabel">Cidade</span>
            <input id="usCity" type="text" autocomplete="off">
          </label>
          <label>
            <span data-i18n="stateLabel">Estado</span>
            <input id="usState" type="text" autocomplete="off">
          </label>
        </div>
        <label>
          <span data-i18n="zipLabel">ZIP Code</span>
          <input id="usZip" type="text" inputmode="numeric" placeholder="10001" autocomplete="off">
        </label>
        <div class="actions">
          <button id="copyUsAddress" class="secondary" type="button" data-i18n="copyButton">Copiar</button>
          <button id="fillUsAddress" type="button" data-i18n="fillPageButton">Preencher página</button>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <footer class="footer">
        <span data-i18n="createdBy">Criado por</span> <strong>Lúdio Oliveira</strong>
        <a href="https://github.com/ludioao" target="_blank" rel="noreferrer">github.com/ludioao</a>
      </footer>
    </main>

    <script src="temp-mail.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
